name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Typecheck(壳+core 源)
        run: npm run typecheck
      # 应用单测在 frontend-core 仓 CI(core 携带全部视图/组件测试)
      - name: Build neutral(server/docker 镜像 flavor)
        run: npm run build
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 产物出现宿主平台代码——平台实现只允许进对应 flavor"
            exit 1
          fi
      - name: Build fnos(fpk flavor)
        run: npm run build:fnos
      - name: fnos 产物适配器存在性验证
        run: |
          grep -rloE "pickSharedFile|trim_open_gateway" dist/assets/ >/dev/null 2>&1 || {
            echo "::error::fnos 产物缺少宿主适配器代码"
            exit 1
          }
      # 镜像正式发布在 server 仓 release.yml（与 server 同版本列车），此处仅验证
      # Dockerfile 可构建（nginx 模板/产物拷贝路径变更能被 PR 及时发现）
      - name: Docker build smoke
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -t pigeonbox-frontend:ci .
