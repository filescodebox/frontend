name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Typecheck(壳+core 源)
        run: npm run typecheck
      # 应用单测在 frontend-core 仓 CI(core 携带全部视图/组件测试)
      - name: Build neutral(server/docker 镜像 flavor)
        run: npm run build
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          # api/qnap 两段判定:frontend-core 请求层的宿主 SSO 鉴权端点白名单
          # (cb1ff09——/api/fnos/login|/api/qnap/login 的 401 是 SSO 不可用的预期
          # 安全失败,不触发强制登出)是正当 neutral 代码,精确放行该一个字面量;
          # 其余 api/qnap* 路径(qnap 适配器 API 客户端特征)仍命中即红。
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway|qnapHostAdapter" dist/assets/ >/dev/null 2>&1 \
             || { grep -rhoE "api/qnap[A-Za-z0-9/_.-]*" dist/assets/ 2>/dev/null | sort -u | grep -qvE "^api/qnap/login$"; }; then
            echo "::error::neutral 产物出现宿主平台代码——平台实现只允许进对应 flavor"
            exit 1
          fi
      # 平台 flavor 已全部迁平台仓(fnos/qnap 的 web/ 自包含构建),由各平台 CI 把守
      # 镜像正式发布在 server 仓 release.yml（与 server 同版本列车），此处仅验证
      # Dockerfile 可构建（nginx 模板/产物拷贝路径变更能被 PR 及时发现）
      - name: Docker build smoke
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -t pigeonbox-frontend:ci .
