name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Gen types(up-to-date check)
        run: |
          npm run gen:api
          git diff --exit-code src/types/api.gen.ts || (echo "✗ api.gen.ts 与 openapi.json 不同步,请运行 npm run gen:api"; exit 1)
